[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-robotic-learning"
version = "0.1.0"
description = "Robotic learning monorepo for SO101 projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "imageio",
    "pillow",
    "gymnasium",
    "stable-baselines3",
    "opencv-python",
    "torch",
    "torchvision",
    "mujoco",
    "scipy",
    "matplotlib",
    "stable_baselines3",
    "tensorboard",
    "ipykernel",
    "optuna>=4,<5",
    "sqlalchemy>=1.4.2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
# Compatibility with existing installation commands. HPO is included by default.
hpo = []

[tool.setuptools.packages.find]
where = ["src"]
